name: pull-translations

on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: transifex-pull
  cancel-in-progress: false

jobs:
  transifex:
    permissions:
      contents: read
    uses: ORCID-dev/public-reusable-workflows/.github/workflows/transifex.yml@v1
    with:
      mode: pull
      resource: orcid-homepage.home
    secrets:
      transifex-token: ${{ secrets.TRANSIFEX_TOKEN }}
      app-client-id: ${{ secrets.GH_APP_CLIENT_ID }}
      app-private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
