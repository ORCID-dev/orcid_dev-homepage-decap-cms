name: ci

on:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    permissions:
      contents: read
    uses: ORCID-dev/public-reusable-workflows/.github/workflows/build.yml@v1
    with:
      name: check
      node-version-file: .nvmrc
      fetch-depth: 0
      run: |
        npm run validate -- --strict
        npm run extract -- --stdout > /dev/null
        if [ -n "${GITHUB_BASE_REF:-}" ] && git show "origin/$GITHUB_BASE_REF:content/home.en.json" > "$RUNNER_TEMP/before.json" 2> /dev/null; then
          node scripts/key-diff.mjs --before "$RUNNER_TEMP/before.json"
        else
          echo "No content file on the base branch; nothing to compare." >> "$GITHUB_STEP_SUMMARY"
        fi
        number=$(jq -r '.number // empty' "$GITHUB_EVENT_PATH")
        npm run build -- --version "pr-${number:-$GITHUB_RUN_ID}"
        npm run validate -- --dist dist/content
        npm test
        npm run format:check
