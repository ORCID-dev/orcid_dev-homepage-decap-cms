name: pages-qa

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'i18n/**'
      - 'admin/**'
      - 'schema/**'
      - 'scripts/**'
      - package.json
      - package-lock.json
      - .github/workflows/pages-qa.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Also the npm cache writer.
  build:
    permissions:
      contents: read
    uses: ORCID-dev/public-reusable-workflows/.github/workflows/build.yml@v1
    with:
      name: build
      node-version-file: .nvmrc
      cache: save
      upload: dist
      run: |
        npm run validate -- --strict
        npm run build -- --version "qa-${GITHUB_SHA::7}"
        npm run validate -- --dist dist/content

  publish:
    needs: build
    permissions:
      contents: write
    uses: ORCID-dev/public-reusable-workflows/.github/workflows/pages.yml@v1
    with:
      artifact: build
      directory: qa
      environment: qa.orcid.org
      message: QA ${{ github.sha }}

  verify:
    needs: publish
    permissions:
      contents: read
    uses: ORCID-dev/public-reusable-workflows/.github/workflows/build.yml@v1
    with:
      name: verify
      node-version-file: .nvmrc
      run: |
        npm run validate:deploy -- --base "https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/qa" \
          --version "qa-${GITHUB_SHA::7}"
