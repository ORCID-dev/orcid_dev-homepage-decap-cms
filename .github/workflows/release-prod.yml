name: release-prod

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing tag to redeploy (run the workflow from that tag), or empty to cut the next patch release.
        type: string
        default: ''

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  version:
    permissions:
      contents: read
    uses: ORCID-dev/public-reusable-workflows/.github/workflows/version.yml@v1
    with:
      version: ${{ inputs.version }}

  # Built once: QA and production get the same bundle.
  build:
    needs: version
    permissions:
      contents: read
    uses: ORCID-dev/public-reusable-workflows/.github/workflows/build.yml@v1
    with:
      name: build
      node-version-file: .nvmrc
      fetch-depth: 0
      upload: dist
      version: ${{ needs.version.outputs.tag }}
      run: |
        if git rev-parse -q --verify "refs/tags/$VERSION" > /dev/null && [ "$(git rev-parse "$VERSION^{commit}")" != "$GITHUB_SHA" ]; then
          echo "::error::$VERSION is on another commit. Run the workflow from tag $VERSION to redeploy it."
          exit 1
        fi
        npm run validate -- --strict
        npm run build -- --version "$VERSION"
        npm run validate -- --dist dist/content

  release:
    needs: [version, build]
    if: inputs.version == ''
    permissions:
      contents: write
    uses: ORCID-dev/public-reusable-workflows/.github/workflows/release.yml@v1
    with:
      tag: ${{ needs.version.outputs.tag }}
      previous-tag: ${{ needs.version.outputs.last-tag }}

  qa:
    needs: [version, build, release]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.release.result != 'failure' }}
    permissions:
      contents: write
    uses: ORCID-dev/public-reusable-workflows/.github/workflows/pages.yml@v1
    with:
      artifact: build
      directory: qa
      environment: qa.orcid.org
      message: QA ${{ needs.version.outputs.tag }}

  verify_qa:
    needs: [version, qa]
    permissions:
      contents: read
    uses: ORCID-dev/public-reusable-workflows/.github/workflows/build.yml@v1
    with:
      name: verify_qa
      node-version-file: .nvmrc
      version: ${{ needs.version.outputs.tag }}
      run: |
        npm run validate:deploy -- --base "https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/qa" --version "$VERSION"
        echo "$VERSION is on QA. Approve the orcid.org environment on this run to publish it." >> "$GITHUB_STEP_SUMMARY"

  production:
    needs: [version, verify_qa]
    permissions:
      contents: write
    uses: ORCID-dev/public-reusable-workflows/.github/workflows/pages.yml@v1
    with:
      artifact: build
      directory: prod
      environment: orcid.org
      message: Production ${{ needs.version.outputs.tag }}

  verify_production:
    needs: [version, production]
    permissions:
      contents: read
    uses: ORCID-dev/public-reusable-workflows/.github/workflows/build.yml@v1
    with:
      name: verify_production
      node-version-file: .nvmrc
      version: ${{ needs.version.outputs.tag }}
      run: |
        npm run validate:deploy -- --base "https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/prod" --version "$VERSION"
