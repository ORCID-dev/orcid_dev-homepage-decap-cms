name: push-translation-source

on:
  push:
    branches: [main]
    paths: ['content/home.en.json']
  workflow_dispatch:

permissions: {}

concurrency:
  group: transifex-push
  cancel-in-progress: false

jobs:
  source:
    permissions:
      contents: read
    uses: ORCID-dev/public-reusable-workflows/.github/workflows/build.yml@v1
    with:
      name: source
      node-version-file: .nvmrc
      upload: i18n/home.en.json
      run: npm run extract

  push:
    needs: source
    permissions:
      contents: read
    uses: ORCID-dev/public-reusable-workflows/.github/workflows/transifex.yml@v1
    with:
      mode: push
      resource: orcid-homepage.home
      artifact: source
      artifact-path: i18n
    secrets:
      transifex-token: ${{ secrets.TRANSIFEX_TOKEN }}
